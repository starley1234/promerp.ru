; Настройки PHP-FPM для PromERP (подключаются как conf.d/zz-promerp.ini).
; Значения рассчитаны на разработку; для продакшена — см. docs/DEPLOY_AND_ROADMAP.md.

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 50

date.timezone = Europe/Moscow
mbstring.internal_encoding = UTF-8
default_charset = UTF-8

; Ошибки: в контейнере показываем всё, приложение само решает (STRICT_DEPRECATIONS)
display_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2

; Ошибки/предупреждения PHP не должны попадать в HTML-ответ
html_errors = Off

; OPcache: включён и в dev (быстрее), перекомпиляция по времени изменения файлов
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; Кэш путей: автозагрузка Kohana ищет каждый класс по десяткам каталогов модулей,
; и без этого кэша все проверки файлов идут в файловую систему заново
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Сессии хранением занимается приложение (application/sessions), но путь нужен
session.save_path = /tmp
session.gc_maxlifetime = 86400
