# nginx для PromERP: web-root — public_html, всё остальное отдаётся через index.php
# (Kohana работает с «чистыми» URL, index_file = FALSE).

server {
    listen 80;
    server_name _;

    root /srv/promerp/public_html;
    index index.php;

    client_max_body_size 64m;

    # Сжатие текста: HTML, CSS, JS и JSON при медленном канале весят втрое меньше
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Статика и загрузки — напрямую
    location /uploads/ {
        try_files $uri =404;
        expires 7d;
    }

    # Свои CSS и JS подписаны версией (?v=…, см. Assets::url), поэтому кэш у них
    # безопасен; шрифты и картинки меняются редко.
    location ~* \.(?:css|js|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Служебное и приватное не должно быть доступно из веба
    location ~ ^/(application|system|modules|tests|docker|docs|vendor)/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
